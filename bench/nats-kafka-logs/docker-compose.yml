name: nats-kafka-logs-bench

services:
  nats:
    image: nats:2.10-alpine
    container_name: bench-nats
    command: -c /etc/nats/nats.conf
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ${BENCH_NATS_DIR:-/mnt/bench/nats}:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  kafka:
    image: apache/kafka:3.9.1
    container_name: bench-kafka
    # The image runs as `appuser`, which cannot write to a root-owned named
    # volume; running as root is the simplest fix for a local bench.
    user: "0:0"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listeners: in-network clients (the injector) use kafka:29092,
      # host clients (Quickwit) use localhost:9092.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512M -Xmx512M
    volumes:
      - ${BENCH_KAFKA_DIR:-/mnt/bench/kafka}:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  inject-nats:
    build: ./injector
    profiles: [inject]
    environment:
      TARGET: nats
      NUM_MESSAGES: ${NUM_MESSAGES:-5242880}
      MSG_BYTES: ${MSG_BYTES:-1024}
      NUM_TENANTS: ${NUM_TENANTS:-16}
      WORKERS: ${WORKERS:-8}
      ACK_EVERY: ${ACK_EVERY:-1000}
      TS_STEP_MS: ${TS_STEP_MS:-16}
      RATE_MIB_S: ${RATE_MIB_S:-0}
    depends_on:
      nats:
        condition: service_healthy

  inject-kafka:
    build: ./injector
    profiles: [inject]
    environment:
      TARGET: kafka
      NUM_MESSAGES: ${NUM_MESSAGES:-5242880}
      MSG_BYTES: ${MSG_BYTES:-1024}
      NUM_TENANTS: ${NUM_TENANTS:-16}
      WORKERS: ${WORKERS:-8}
      TS_STEP_MS: ${TS_STEP_MS:-16}
      RATE_MIB_S: ${RATE_MIB_S:-0}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-16}
    depends_on:
      kafka:
        condition: service_healthy
