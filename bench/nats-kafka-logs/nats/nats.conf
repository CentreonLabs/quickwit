# JetStream sizes its own storage limit from the store filesystem and keeps
# headroom, so on a tmpfs sized close to the corpus it starts refusing writes
# with `resource limits exceeded` well before the tmpfs is full. Stating the
# limit explicitly keeps the injectable corpus a property of this file rather
# than of the mount size.
http_port: 8222

jetstream {
  store_dir: "/data"
  max_file: 7GB
  max_mem: 1GB
}
